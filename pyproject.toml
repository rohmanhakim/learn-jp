[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-jp"
version = "0.1.0"
description = "CLI-first Japanese language learning system"
requires-python = ">=3.9"
dependencies = [
    "requests",
]

[project.scripts]
learn-jp = "learn_jp.cli:main"

[tool.setuptools.packages.find]
include = ["learn_jp*", "lib*"]